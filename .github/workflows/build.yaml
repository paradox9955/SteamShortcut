on:
  workflow_dispatch:

env:
  RELEASE_NAME: SteamShortcut
  DOTNET_VERSION: '9.0.x'

jobs:
  build-and-release:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install dependencies
        run: dotnet restore

      - name: Set release version
        shell: bash
        run: |
          majorMinor=$(tr -d '[:space:]' < VERSION)

          if ! git tag --list "${majorMinor}.*" | grep -q .; then
            nextVer="${majorMinor}.1"
          else
            lastVer=$(git tag --list "${majorMinor}.*" --sort=-v:refname | head -n1)

            if [[ "$lastVer" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              nextPatch=$((10#${BASH_REMATCH[3]} + 1))
              nextVer="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$nextPatch"
            else
              echo "::error::Invalid version tag: $lastVer"
              exit 1
            fi
          fi

          echo "RELEASE_VERSION=$nextVer" >> "$GITHUB_ENV"
          echo "Using version: $nextVer"

      - name: Validate variables
        shell: bash
        run: |
          echo "RELEASE_VERSION: $RELEASE_VERSION"
          echo "RELEASE_NAME: $RELEASE_NAME"

          if [ -z "$RELEASE_VERSION" ]; then
            echo "::error::RELEASE_VERSION is empty"
            exit 1
          fi

      - name: Normalize version
        shell: bash
        run: |
          clean_version=$(echo "$RELEASE_VERSION" | tr -d '[:space:]')
          echo "RELEASE_VERSION=$clean_version" >> "$GITHUB_ENV"

      - name: Build Release
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          $output = "$env:RELEASE_NAME-$version"

          dotnet publish SteamShortcut/SteamShortcut.csproj `
            -p:PublishSingleFile=true `
            --self-contained false `
            --output "$output" `
            -p:AssemblyVersion="$version" `
            -p:Version="$version" `
            -p:VersionSuffix="" `
            -p:ExtraDefineConstants=PRODUCTION_BUILD `
            -p:DebugType=None `
            -p:DebugSymbols=false

      - name: Test
        run: dotnet test --no-restore --verbosity normal

      - name: Create portable ZIP
        uses: vimtor/action-zip@v1
        with:
          files: ${{ env.RELEASE_NAME }}-${{ env.RELEASE_VERSION }}
          dest: ${{ env.RELEASE_NAME }}-${{ env.RELEASE_VERSION }}-portable.zip
          recursive: true

      - name: Update version in RELEASE.md
        shell: bash
        run: |
          sed -i "s|#{GIT_TAG_NAME}|${RELEASE_VERSION}|g" RELEASE.md

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.RELEASE_VERSION }}
          artifacts: "*.zip"
          prerelease: true
          generateReleaseNotes: true
          bodyFile: RELEASE.md
